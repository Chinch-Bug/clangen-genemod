# whether or not development tools are disabled
dev_tools = false

[seasons]
  # set to true to force the season to be locked at the Clan's starting_season
  lock_season = false

  # sets the starting season
  force_starting_season = false

  # the possible seasons, in order
  calendar = ["Newleaf", "Greenleaf", "Leaf-fall", "Leaf-bare"]

  # how long each season lasts
  length = 3

[cruel_season]
  card_limit = 12

  # for specifying that a hyper-specific reaction should occur due to a card
  [cruel_season.event]
    # set to true to also kill a random cat when the leader dies
    stolen_vitality = false

# settings regarding relationship events, also called "interactions"
[relationship]
  # sets the max amount of interactions a cat can have each moon
  max_interaction = 4

  # sets the max amount of interactions a cat with a special role (leader, deputy, medicine cat, or mediator) can have each moon
  max_interaction_special = 6

  # 1/x chance for the cat to try and trigger a group event
  chance_of_group_event = 5

  # maximum number of cross-clan relationship events that can happen each moon (multiclan only)
  max_crossclan_interaction = 15

  # sets the positive or negative effect that interactions will have on other cats based on personality compatibility
  compatibility_effect = 5

  # Used for patrol and moon event relationship changes. 0.5 - half the usual change, 0 - no change, 1 - the usual change, etc.
  pos_rel_change_multiplier = 1
  neg_rel_change_multiplier = 1

  # base 1/chance of a romance interaction with another cat, when a cat has a mate
  chance_romance_not_mate = 15

  # set to True if deputies should be more likely to have negative rel events with the leader
  deputy_to_leader_neg_buff = false
  # the higher the number, the more likely the deputy will have a negative respect event with the leader
  deputy_envy_leader_influence = 0

  [relationship.value_change_amount]
    # amount a relationship changes for "high", "medium", and "low" effects for interactions
    low = 8
    medium = 12
    high = 16

  [relationship.pair_events]
    # weights for each type of intensity
    [relationship.pair_events.intensity_chances]
      low = 3
      medium = 4
      high = 2

  [relationship.group_events]
    # the possible amounts of cats that can be chosen for a multi_cat group
    multi_cat_amounts = [2, 3, 4]

    # weights for each type of intensity
    [relationship.group_events.intensity_chances]
      low = 2
      medium = 3
      high = 1



  [relationship.value_intervals]
    # The cut-off for each value level. This starts at -100 with each int marking the end of that level. 
    # For example, extreme_neg ends at -70, making its full range -100 to -70. mid_neg starts from -69 and continues till -25.
    # NOTE: increasing extreme_pos past 100 or decreasing extreme_neg below -100 will probably break things
      extreme_neg = -70
      mid_neg = -25
      low_neg = -6
      neutral = 5
      low_pos = 24
      mid_pos = 69
      extreme_pos = 100

  [relationship.colours]
    # colours are RGB values, each number is a value from 0 to 255
    neutral = [130, 117, 82]
    low_pos = [182, 174, 51]
    mid_pos = [150, 195, 49]
    extreme_pos = [154, 241, 32]
    low_neg = [186, 128, 60]
    mid_neg = [214, 90, 53]
    extreme_neg = [233, 38, 30]

[mates]
  # permit player to change cat mates
  allow_manual = true
  
  # allow mates to happen
  allow_mating = true

  # chance that second parent will be set as mate when single cats have litters with them
  crossclan_litter_mates_chance = 0.2
  outsider_litter_mates_chance = 0.1

  # maximum age difference allowed for cats to be romantic with each other
  age_range = 40

  # if true, disables the same-age group check
  override_same_age_group = false

  # 1/chance of becoming mates when the conditions are fulfilled
  chance_fulfilled_condition = 5

  # 1/chance of becoming mates, triggers with friends_to_lover (has to be a high number because many relationships are checked each moon)
  chance_friends_to_lovers = 170

  # base 1/chance for mates to break up. Affected by relationship values and personality compatibility. 0 disables breakups entirely
  base_breakup_chance = 30

  # chance to move on from a dead or absent mate, fraction represents a percentage. default is 30% chance.
  chance_to_move_on = 0.3


  # NOTE FOR RELATIONSHIP CONSTRAINTS
  #  0: no condition
  #  positive number: value has to be higher than number
  #  negative number: value has to be lower than number

  [mates.confession]
    # if one cat has these feelings for another, they confess (if there are more, the highest romance will be chosen)
    [mates.confession.make_confession]
    romance = 30
    like = 15
    respect = 0
    comfort = 10
    trust = 0

    # if these conditions are fulfilled by the opposite cat, they accept, otherwise, they reject
    [mates.confession.accept_confession]
    romance = 17
    like = 15
    respect = 0
    comfort = 10
    trust = 0

  # both relationships have to fulfill this condition to become mates
  [mates.mate_condition]
    romance = 20
    like = 30
    respect = 0
    comfort = 20
    trust = 0

  # requirements for a like relationship to become romance
  [mates.like_to_romance]
    romance = 0
    like = 30
    respect = 0
    comfort = 20
    trust = 0

  [mates.poly]
    # which conditions all current mate relationships has to have towards the main cat + vice versa
    [mates.poly.current_mate_condition]
      romance = 30
      like = 0
      respect = 0
      comfort = 15
      trust = 25

    # which conditions all current mate relationships has to have towards the new possible mate + vise versa
    [mates.poly.mates_to_each_other]
      romance = 0
      like = 15
      respect = 0
      comfort = 15
      trust = 20

  # these denote how relationships change upon a breakup
  [mates.breakup]
    threshold = 120
    variability = [-10, 10]
    [mates.breakup.default_weights]
      had_fight = 3
      decided_to_be_friends = 3
      lost_feelings = 2
      bad_breakup = 5
      chill_breakup = 5

    [mates.breakup.reactions.had_fight]
      romance = -20
      like = -10
      trust = -15
    [mates.breakup.reactions.decided_to_be_friends]
      romance = -50
      like = 30
      trust = 20
      comfort = 10
      respect = 10
    [mates.breakup.reactions.lost_feelings]
      romance = -30
      like = -10
      comfort = -10
    [mates.breakup.reactions.bad_breakup]
      romance = -20
      like = -10
      trust = -30
      comfort = -20
      respect = -10
    [mates.breakup.reactions.chill_breakup]
      romance = -20
      comfort = -10
      respect = 10


[new_cat]
  # number of welcoming events to add when a new cat joins
  cat_amount_welcoming = 3

  # ext_relative_modifer * parents(len) is what will a relative's relation toward the parent 
  # will be divided by when deciding on a relative's initial relationship toward a kit
  ext_relative_modifier = 2
  # relationship buffs represent "default" relationship values that are then lightly randomized
  # in order to create initial relationship values for cats

  [new_cat.parent_buff]
    # default relationships buff for a kit's relationships to their parents
    [new_cat.parent_buff.kit_to_parent]
      romance = 0
      like = 40
      respect = 30
      comfort = 70
      trust = 60

    # default relationships buff for a parent's relationships to their kits
    [new_cat.parent_buff.parent_to_kit]
      romance = 0
      like = 60
      respect = 30
      comfort = 70
      trust = 60

  [new_cat.sib_buff]
    # default relationships buff for siblings' relationships in one direction
    [new_cat.sib_buff.cat1_to_cat2]
      romance = 0
      like = 40
      respect = 10
      comfort = 40
      trust = 30

    # default relationships buff for siblings' relationships in the other direction
    [new_cat.sib_buff.cat2_to_cat1]
      romance = 0
      like = 40
      respect = 10
      comfort = 40
      trust = 30

  [new_cat.rel_buff]
    # default relationships buff for new cats relationships to other cats in the clan
    [new_cat.rel_buff.new_to_clan_cat]
      romance = 0
      like = 15
      respect = 10
      comfort = 15
      trust = 15

    # default relationships buff for clan cats' relationships to new cats in the clan
    [new_cat.rel_buff.clan_cat_to_new]
      romance = 0
      like = 15
      respect = 5
      comfort = 10
      trust = 10

[pregnancy]
  # cooldown for cats getting pregnant that applies after giving birth
  birth_cooldown = 6

  # 1/chance that kits, relationship and other factors will influence this chance. modded_ is used with modded litters
  primary_chance_mated = 80
  modded_primary_chance_mated = 50

  # 1/chance that kits, relationship and other factors will influence this chance. modded_ is used with modded litters
  primary_chance_unmated = 130
  modded_primary_chance_unmated = 100

  # healer-specific litter chance modifier, added to the applicable base litter chance
  healer_modifier = 0

  # 1/chance that a mated cat has an affair
  random_affair_chance = 50

  # 1/chance for an unmated cat to have an affair (coparenting)
  # for this check, only other unmated cats can be the affair partner
  unmated_random_affair_chance = 10

  # proportion of situations where surrogacy will be selected when applicable (0 - never, 1 - always)
  surrogate_rate = 1

  # 1/chance for cats to select a clanmate as a surrogate when possible
  clanmate_surrogate_chance = 5

  # 1/chance for unmated cats to have a multi-sire litter with outside sires
  multi-sire_chance = 5

  # maximum amount of outsider sires for a litter
  multi-sire_max_sires = 5

  # default chance 0-1 for a litter with an outside parent to be a half-clan litter
  half-clan_chance = 0.25

  # 1/chance that a phantom pregnancy will happen when cats fail to have a litter
  false_pregnancy_chance = 500

  # 1/chance that a pregnancy will be hidden from the player until a cat gives birth
  hidden_pregnancy_chance = 200

  # The kit number is incremental. It is 1-6 as default so if you change these numbers, you should probably keep this in mind.
  # As in, your max kits number should probably be 5 more than the min kits number.
  # But that's not required - just makes more sense that way with how the litters are generated.
  min_kits = 1
  max_kits = 6

  # number / total for that age across all kit amounts = chance of having that many kits for that age
  [pregnancy.one_kit_possibility]
    "young adult" = 8
    adult = 9
    "senior adult" = 10
    senior = 4

  [pregnancy.two_kit_possibility]
    "young adult" = 10
    adult = 13
    "senior adult" = 15
    senior = 3

  [pregnancy.three_kit_possibility]
    "young adult" = 17
    adult = 15
    "senior adult" = 5
    senior = 1

  [pregnancy.four_kit_possibility]
    "young adult" = 12
    adult = 8
    "senior adult" = 2
    senior = 0

  [pregnancy.five_kit_possibility]
    "young adult" = 6
    adult = 2
    "senior adult" = 0
    senior = 0

  [pregnancy.max_kit_possibility]
    "young adult" = 2
    adult = 0
    "senior adult" = 0
    senior = 0

  [pregnancy.one_kit_modded]
    "young adult" = 128
    adult = 8
    "senior adult" = 16
    senior = 2
  [pregnancy.two_kit_modded]
    "young adult" = 256
    adult = 16
    "senior adult" = 32
    senior = 8
  [pregnancy.three_kit_modded]
    "young adult" = 256
    adult = 32
    "senior adult" = 64
    senior = 8
  [pregnancy.four_kit_modded]
    "young adult" = 256
    adult = 32
    "senior adult" = 64
    senior = 4
  [pregnancy.five_kit_modded]
    "young adult" = 128
    adult = 32
    "senior adult" = 64
    senior = 2
  # 6-8 random litter size
  [pregnancy.six_kit_modded]
    "young adult" = 64
    adult = 16
    "senior adult" = 32
    senior = 1
  # 9-12 random litter size
  [pregnancy.nine_kit_modded]
    "young adult" = 16
    adult = 4
    "senior adult" = 6
    senior = 0
  # 13-19 random litter size
  [pregnancy.max_kit_modded]
    "young adult" = 1
    adult = 1
    "senior adult" = 1
    senior = 0
  # stillborn chances depend on litter size
  # small = 0-2, three = 3, mid = 4-5, big = 6-8, large = 9+
  [pregnancy.stillborn_chances]
    small = 0.01
    three = 0.025
    mid = 0.05
    big = 0.1
    large = 0.15

[cat_generation]
  # base 1/chance that a cat will generate with a permanent condition. gets modified further in code
  base_permanent_condition = 90

  # kittypets will have a higher chance of having many rarer genes, even if not purebred
  kittypet_gene_boost = false

[cat_name_controls]
  # if changing prefixes is enabled, 1/chance for a cat to change their prefix when coming out as trans
  trans_prefix_change_chance = 25

  # determines which list outsiders pull from: silly_names, human_names, loner_names, or normal_prefixes
  # number / total for each control

  kittypet = [30, 50, 10, 10]
  loner = [5, 15, 50, 30]
  rogue = [3, 7, 35, 55]
  clancat = [10, 10, 20, 40]

  # set to True to always use English names instead of the localized version
  always_use_english = false

  # if changing prefixes is enabled, this is the chance of the prefix changing during ceremonies 
  # (eg. kit-apprentice is during apprentice ceremony)
  
  # pelt_change_modifier is for how much more likely the change is if a cat's appearance has significantly changed
  # such as for cats developing vitiligo, turning red from amber, etc.
  [cat_name_controls.prefix_change_chance]
    kit-apprentice = 75
    apprentice-warrior = 75
    warrior-elder = 75
    pelt_change_modifier = 15
    
  [cat_name_controls.alt_suffixes] # only with alt suffixes on
    # how likely should a suffix list be (relative to each other)
    primary_skill = 4
    secondary_skill = 2

    trait = 2
    general_honour = 1
    trait_honour = 1 # trait-specific honours lists ; if trait-specific honours removed entirely, uses general_honour instead

    special = 1
    common = 3 # for cats not graduating early
    common_early = 1 # for healers graduating before 15 and other cats graduating before 12 moons old

[accessory_generation]
  # base 1/chance a cat generates with an accessory 
  base_acc_chance = 150

  # modifiers for accessories add or subtract from chance IN THE DENOMINATOR 
  #   i.e. 1/(chance + med_modifier + baby_modifier + elder_modifier + ...)
  # so SUBTRACTING will INCREASE the chance an accessory is given

  # modifies accessory chance based on if cat is a medicine cat
  med_modifier = -80

  # modifies accessory chance based on if cat is a kitten or adolescent
  baby_modifier = -20

  # modifies accessory chance based on if cat is a senior or senior adult
  elder_modifier = 20

  # modifies accessory chance based on if cat has "happy" traits
  happy_trait_modifier = -30

  # modifies accessory chance based on if cat has "grumpy" traits
  grumpy_trait_modifier = 30

  # modifies accessory chance based on if cat had a ceremony
  ceremony_modifier = -20

  # modifies accessory chance based on if cat already has at least one other accessory
  multiple_acc_modifier = 50

[transition_related]
  # base 1/chance that a cat will trans their gender
  base_trans_chance = 256

  # modifiers for transitioning add or subtract from chance IN THE DENOMINATOR 
  #   i.e. 1/(chance + adolescent_modifier + older_modifier)
  # so SUBTRACTING will INCREASE the chance a cat transitions

  # modifies transition chance based on if cat is a kitten or adolescent
  adolescent_modifier = -128

  # modifies transition chance based on if cat is an adult or older
  older_modifier = 256

[fading]
  # age that a cat will complete fading
  age_to_fade = 202

  # kits fade faster if modded kits is on
  kit_fade = 24

  # max opacity when a cat fades
  opacity_at_fade = 20

  # affects curve of how fast a cat's sprite will fade
  visual_fading_speed = 5

[roles]
  # base 1/chance that a cat will be chosen as a mediator apprentice
  mediator_app_chance = 50

  # base 1/chance that a cat will be chosen as a queen apprentice
  queen_app_chance = 75

  # base 1/chance that a cat will be chosen as a med cat apprentice
  base_medicine_app_chance = 41

  [roles.become_mediator_chances]
    # 1/chance that a cat will switch to mediator. rolls every moon, so keep it high.
    warrior = 5000
    elder = 400

  [roles.become_queen_chances]
    # 1/chance that a cat will switch to queen. rolls every moon, so keep it high.
    warrior = 4000
    mediator = 7500
    elder = 500

  [roles.become_healer_chances]
    # 1/chance that a cat will switch to mediator. rolls every moon, so keep it high.
    warrior = 7500
    apprentice = 1000

  [roles."medicine cat apprentice"]
    # maximum number of medicine cat apprentices to full medicine cats (e.g. 4 adult medcats can have 2 apps total)
    max_medcats_to_apps = 2

    # minimum percentage of medcat population that are seniors for buff to app chance
    threshold_percentage_seniors = 30

    # how many moons is considered "very old"
    threshold_moons_ancient = 150

    # minimum percentage of medcat population that are ancient for buff to app chance
    threshold_percentage_ancient = 30

[retirement]
  # max 1/chance for old leaders to retire if enabled
  max_leader_retire_chance = 50

  # max 1/chance for old healers to retire if enabled
  max_healer_retire_chance = 10

  # max 1/chance for old mediators to retire if enabled
  max_mediator_retire_chance = 25

  # max 1/chance for old permaqueens to retire
  max_queen_retire_chance = 25

  # cats may retire once they reach the min age, and will automatically retire if over 25 moons above it
  min_retirement_age = 115

[lost_cat]
  # 1/chance that a lost cat will return on their own
  rejoin_chance = 20

  # 1/chance for a cat to rejoin the Clan if recently tnred. Only rolled once
  rejoin_tnr_chance = 2

[cat_ages]
  # represents ranges for cat ages
  # these HAVE to be in the correct order: where one ends, the next one begins on the next number
  # if you DON'T DO THIS, your game WILL break
  newborn = [0, 0]
  kitten = [1, 5]
  adolescent = [6, 11]
  "young adult" = [12, 47]
  adult = [48, 95]
  "senior adult" = [96, 119]
  senior = [120, 300]

[cat_sprites]
  # set to false to disable sick sprites
  sick_sprites = true

  # This is used to recolor lineart to blend in better
  lineart_color_sc = [47, 51, 64]
  lineart_color_df = [30, 8, 11]

[thought_generation]
  # the ID of the thoughts to ensure
  debug_ensure_thought_id = ""
  # if you want to ensure a specific string from the thought's options, include its index here.
  # by default the first string will be used (index 0)
  debug_ensure_thought_index = 0


[patrol_generation]
  # modifies success rate based on game mode. higher = more difficult.
  difficulty_modifier = 2.5
  classic_difficulty_modifier = 1

  # amount to modify patrol success based on patrol stats
  # increasing this value increases the NUMERATOR for success (denominator is fixed at 120)
  win_stat_cat_modifier = 10
  better_stat_modifier = 5
  best_stat_modifier = 10
  fail_stat_cat_modifier = -15

  # base 1/chance for a romance patrol. gets modified further in code
  chance_of_romance_patrol = 16

  # forces patrol with this id to occur, assuming it's possible by constraints
  debug_ensure_patrol_id = ""

  # set to true to remove all constraints for patrols regarding location, session, biomes, etc.
  debug_override_patrol_stat_requirements = false

  # set to true (NO QUOTES) to ensure the debug patrol succeeds
  # set to false (NO QUOTES) to ensure the debug patrol fails
  debug_ensure_patrol_outcome = ""

[event_generation]
  # forces event with this id to occur
  debug_ensure_event_id = ""

  # forces events of this kind to occur. can be:
  #   "new_cat" | "death" | "injury" | "misc"
  debug_type_override = ""

  # forces specified event to occur regardless of if requirements are met
  debug_override_requirements = false

  # forces the given frequency, frequency can be a number from 1-4
  debug_override_frequency = 0

  # modifies the likelihood of moonskip events that effect relationships between Clans. 
  # 0 is default, -1 would try to ensure only negative events happen, 1 would try to ensure only positive events happen, 
  # -0.5 would make positive events about half as likely as normal ; 0.5 would make negative events about half as likely as normal
  clan_rel_change_multiplier = 0

[death_related]
  # the maximum lives a leader can have
  max_leader_lives = 9

  # number of lives leaders receive - will pick from the list, so something like [7, 8, 9] would have an equal random chance of 7, 8, and 9
  leader_lives_nr = [9]

  # base 1/chance that leader will die
  leader_death_chance = 50

  # base 1/chance a cat will die
  classic_death_chance = 500
  death_chance = 350

  # modifiers for death chance based on if a war is going badly
  # SUBTRACTS from the denominator so higher = more likely to die
  war_death_modifier_leader = 35
  war_death_modifier = 330

  # 1/2^x chance for mass death event to trigger per cat on moonskip
  mass_death_chance = 9
  # maximum number of cats that can die from a single mass death event
  max_mass_deaths = 10
  # Maximum amount to pick for mass death events when triggered (max will be 1/3 of the living clan cats if that is smaller)
  max_mass_death = 10

  # age cats will start dying of old age based on old_age_death_curve
  old_age_death_start = 150

  # multiplier that affects the chances of cats dying once they are over old_age_death_start moons
  # Average life expectancy with default old_age_death_start of 150 moons:
  #   1 = 189 moons, 2 = 178, 3 = 172, 4.5 (default) = 168, 8 = 163, 20 = 158
  old_age_death_curve = 4.5

  # if you have modded kits on, this is the highest modifier permaqueens can have for lowering kitten death chances
  # 1 = completely negate kit death boosts, 0 = no influence at all, 0.5 - half the chance of death, etc.
  # will be less effective if there's not enough permaqueens in your Clan, however
  max_queen_influence = 0.2

  # 0-1 chance for a kit of a certain age to die on moonskip if modded litters is on 
  [death_related.kit_death_chances]
    "0" = 0.33
    "1" = 0.15
    "2" = 0.1
    "3" = 0.1
    "4" = 0.05
    "5" = 0.05

  [death_related.murder]
    # base 1/2^(chance) a completely random murder occurs
    # aggression and instability will make the denominator lower and increase chance of murder
    base_random_murder_chance = 11

    # base 1/chance a disliked cat will be murdered when not in the same Clan
    base_crossclan_murder_kill_chance = 130

    # base 1/chance a disliked cat will be murdered
    base_murder_kill_chance = 80

    # The higher this number, the more likely a deputy will murder their leader.
    # note that this doesn't make the deputy more likely to murder in general
    # so they still need to be "capable" of it and have negative relationship with their leader.
    deputy_murder_modifier = 0

    # set to true to have the deputy prefer to murder the leader over other negative relationships
    deputy_prefer_leader = false

[condition_related]
  # 10/chance an illness will occur
  illness_chance = 250
  classic_illness_chance = 500

  # if a cat has a permanent condition with defined seasonal risks, the above illness chance is divided by the modifier to determine if they get a seasonal risk
  # eg. default expanded_illness chance is 250 and default condition_modifier is 5, so 1/5 chance of permanent condition risk appearing 
  classic_perm_condition_modifier = 5
  perm_condition_modifier = 5
  
  # how much each medicine cat reduces the chance of infection, higher number is better
  med_infection_reduction = 10
  # the seasons in which illnesses can spread. Fleas will always be able to spread in all seasons.
  illness_outbreak_season = ["Leaf-bare", "Leaf-fall"]
  # if there are more sick cats than this percentage of healthy cats then further outbreaks are prevented
  # for example: 2 sick cats and 4 healthy cats. 25% of 4 is 1 and there are 2 sick cats. 2 is more than 1, so no illness can spread
  illness_percentage_max = 0.25

  # 5/chance (for most personalities) or 15/chance (for some personalities) an injury will occur 
  classic_injury_chance = 450
  injury_chance = 250

  # 1/chance a cat will get a permanent condition from an event with that possibility 
  permanent_condition_chance = 15

  # modifiers for injury chance based on if a war is going badly
  # SUBTRACTS from the denominator so higher = more likely to get injured
  war_injury_modifier = 225

[ranks]
  # permit player to change cat ranks
  allow_manual = true

[clan_creation]
  # Set this to -1 for it to be infinite
  rerolls = 3 
  
  # other clans will start with a random relation between the two numbers
  starting_clan_relation = [8, 12]

  # If true, boosts the chance of rarer genes and breeds for founding cats
  use_special_roller = true

  # how many neighbouring clans are generated on clan creation. Must be at least 1
  # the game is also not built to handle more than 5 so issues may potentially arise with more
  other_clans_range = [2, 5]

  # range of outsiders to generate upon Clan creation
  starting_outsiders = [0, 0]

  # range of cats to pick on quickstart (not counting the leader, deputy, and healer)
  quickstart_cats = [4, 7]

